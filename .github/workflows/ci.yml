name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Lint
        run: python -m ruff check . && python -m ruff format --check src tests scripts
      # No corpus and no model: corpus tests skip with a reason.
      - name: Test
        run: python -m pytest -q
